          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
          description: Kategoriya yaratilgan sana va vaqt
      required:
      - created_at
      - id
      - name
    CategoryRequest:
      type: object
      description: Kategoriya serializer.
